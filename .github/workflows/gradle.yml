name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        build-root-directory: plugin

    - name: Fix Windows CRLF line endings & set executable
      run: |
        sed -i 's/\r$//' ./plugin/gradlew
        chmod +x ./plugin/gradlew

    - name: Build Shadow JAR
      run: |
        cd plugin
        ./gradlew shadowJar --no-daemon

    - name: Upload Built JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaiuCombatAC
        path: plugin/build/libs/MaiuCombatAC-*.jar
