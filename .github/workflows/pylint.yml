name: Python Lint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install flake8
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Lint Python Scripts
      run: |
        # Prüft nur grobe Syntax-Fehler, bricht nicht wegen Kleinigkeiten ab
        flake8 ai/ --count --select=E9,F63,F7,F82 --show-source --statistics
